<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E676;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4de;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="5" y="5" width="90" height="90" rx="20" ry="20" 
        fill="none" stroke="url(#logoGrad)" stroke-width="3"/>
  
  <!-- Bus/Network lines -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="25" y1="35" x2="75" y2="35" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="25" y1="65" x2="75" y2="65" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Master node (left) -->
  <circle cx="25" cy="50" r="10" fill="#080d0b" stroke="#f04545" stroke-width="3"/>
  <text x="25" y="54" text-anchor="middle" fill="#f04545" font-size="10" font-family="monospace" font-weight="bold">M</text>
  
  <!-- Device nodes -->
  <circle cx="50" cy="50" r="8" fill="#080d0b" stroke="#00E676" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="4" fill="#00E676"/>
  
  <circle cx="70" cy="50" r="8" fill="#080d0b" stroke="#00E676" stroke-width="2.5"/>
  <circle cx="70" cy="50" r="4" fill="#00E676"/>
  
  <!-- Signal wave -->
  <path d="M 35 50 Q 40 40, 45 50 T 55 50" fill="none" stroke="#00d4de" stroke-width="2" opacity="0.8"/>
  
  <!-- Lightning bolt accent -->
  <polygon points="58,28 62,38 68,38 60,48 64,58 52,44 56,44 52,34" 
           fill="url(#logoGrad)" filter="url(#glow)"/>
</svg>
